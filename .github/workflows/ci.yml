name: Tests and distributions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[ml,io,dev]"
      - run: python -m pytest --cov=rigid --cov-report=xml --cov-fail-under=85 --junitxml=test-results.xml
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy --follow-imports=skip src/rigid/config.py src/rigid/provenance.py src/rigid/checkpoint.py src/rigid/storage.py src/rigid/serialization.py src/rigid/runs.py
      - run: python -m build
      - run: python tools/check_distribution.py --wheel-dir dist --output verification/installed-wheel --demo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checks-${{ matrix.os }}-${{ matrix.python }}
          path: |
            test-results.xml
            coverage.xml
            dist/*
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel
      - run: ctest --test-dir build/native --output-on-failure
      - run: python -m pytest tests/test_native.py
        env:
          RIGID_NATIVE_LIBRARY: ${{ github.workspace }}/build/native/librigid_kernels.so
      - run: cmake -S . -B build/sanitized -DRIGID_ENABLE_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/sanitized --parallel
      - run: ctest --test-dir build/sanitized --output-on-failure
