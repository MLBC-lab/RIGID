[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rigid-transcriptomics"
version = "0.3.0"
description = "Inverse transcriptomic candidate ranking, molecular proposal, and reliability evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "RIGID contributors"}]
keywords = ["transcriptomics", "L1000", "molecular-design", "graph-neural-networks", "drug-discovery"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.26,<3", "rdkit>=2024.3"]

[project.optional-dependencies]
ml = ["torch>=2.6,<3"]
io = ["h5py>=3.10"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.11", "build>=1.2", "wheel>=0.43"]

[project.scripts]
rigid = "rigid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rigid = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: small complete training and inference workflows"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.coverage.run]
source = ["rigid"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
